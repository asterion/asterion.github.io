<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking FIFA</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a212b;
      --row: #1f2730;
      --row-alt: #232c37;
      --accent: #4ade80;
      --gold: #fbbf24;
      --silver: #cbd5e1;
      --bronze: #d97706;
      --text: #e5e7eb;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(160deg, #0f1419 0%, #131b24 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container { max-width: 760px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 1.5rem; }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    h1 .sub { color: var(--accent); }
    header p { color: var(--muted); margin-top: 0.4rem; font-size: 0.9rem; }
    .search {
      width: 100%;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      background: var(--card);
      border: 1px solid #2a3340;
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    .search:focus { border-color: var(--accent); }
    .card {
      background: var(--card);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left;
      padding: 0.85rem 1rem;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      border-bottom: 1px solid #2a3340;
    }
    thead th.num, tbody td.num { text-align: right; }
    tbody td { padding: 0.7rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.04); }
    tbody tr:nth-child(even) { background: var(--row-alt); }
    tbody tr:hover { background: #2b3542; }
    .pos {
      font-weight: 700;
      width: 2.5rem;
      color: var(--muted);
      text-align: center;
    }
    tr.top1 .pos { color: var(--gold); }
    tr.top2 .pos { color: var(--silver); }
    tr.top3 .pos { color: var(--bronze); }
    .country { display: flex; align-items: center; gap: 0.65rem; font-weight: 600; }
    .flag { font-size: 1.4rem; line-height: 1; }
    .points {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--accent);
    }
    footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 1.2rem; }
    .empty { padding: 2rem; text-align: center; color: var(--muted); }

    .compare {
      background: var(--card);
      border-radius: 14px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    .compare h2 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 0.9rem;
      color: var(--text);
    }
    .compare h2 span { color: var(--accent); }
    .selectors { display: flex; gap: 0.75rem; align-items: center; }
    .selectors select {
      flex: 1;
      padding: 0.7rem 0.8rem;
      background: var(--row);
      border: 1px solid #2a3340;
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
    }
    .selectors select:focus { border-color: var(--accent); }
    .vs { font-weight: 800; color: var(--muted); font-size: 0.9rem; }
    .result { margin-top: 1.1rem; }
    .result.hidden { display: none; }
    .versus-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.5rem;
      align-items: stretch;
    }
    .vcard {
      background: var(--row);
      border-radius: 12px;
      padding: 1rem 0.75rem;
      text-align: center;
      border: 2px solid transparent;
    }
    .vcard.winner { border-color: var(--accent); background: #1e2b27; }
    .vcard .vflag { font-size: 2.4rem; line-height: 1; }
    .vcard .vname { font-weight: 700; margin-top: 0.3rem; }
    .vcard .vpts { font-size: 1.5rem; font-weight: 800; color: var(--accent); margin-top: 0.5rem; font-variant-numeric: tabular-nums; }
    .vcard .vlabel { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .vcard .vpos { font-size: 0.85rem; color: var(--muted); margin-top: 0.35rem; }
    .vmid { display: flex; align-items: center; justify-content: center; }
    .vmid .crown { font-size: 1.4rem; }
    .summary {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: var(--row-alt);
      border-radius: 10px;
      font-size: 0.9rem;
      text-align: center;
      color: var(--text);
    }
    .summary strong { color: var(--accent); }
    .predict {
      margin-top: 0.75rem;
      padding: 1rem;
      background: var(--row);
      border: 1px dashed #2a3340;
      border-radius: 10px;
      text-align: center;
    }
    .predict .plabel { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .predict .score {
      font-size: 2rem;
      font-weight: 800;
      margin: 0.4rem 0;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }
    .predict .score .pflag { font-size: 1.6rem; }
    .predict .score .dash { color: var(--muted); }
    .predict .ptip { font-size: 0.82rem; color: var(--muted); }
    @media (max-width: 480px) {
      .vcard .vflag { font-size: 1.8rem; }
      .vcard .vpts { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Ranking <span class="sub">FIFA</span></h1>
      <p>Clasificación mundial de selecciones por puntos</p>
    </header>
    <section class="compare">
      <h2>Comparar <span>dos selecciones</span></h2>
      <div class="selectors">
        <select id="selA"></select>
        <span class="vs">VS</span>
        <select id="selB"></select>
      </div>
      <div id="result" class="result hidden">
        <div class="versus-grid">
          <div id="cardA" class="vcard"></div>
          <div class="vmid"><span class="crown">⚔️</span></div>
          <div id="cardB" class="vcard"></div>
        </div>
        <div id="summary" class="summary"></div>
        <div id="predict" class="predict"></div>
      </div>
    </section>

    <input type="text" id="search" class="search" placeholder="Buscar país…" autocomplete="off">
    <div class="card">
      <table>
        <thead>
          <tr>
            <th class="num">Pos.</th>
            <th>País</th>
            <th class="num">Puntos</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="empty" style="display:none">Sin resultados.</div>
    </div>
    <footer id="footer"></footer>
  </div>

  <script>
    const data = [
      [1, "Argentina", 1877.27, "🇦🇷"],
      [2, "España", 1874.71, "🇪🇸"],
      [3, "Francia", 1870.70, "🇫🇷"],
      [4, "Inglaterra", 1828.02, "🏴󠁧󠁢󠁥󠁮󠁧󠁿"],
      [5, "Portugal", 1767.85, "🇵🇹"],
      [6, "Brasil", 1765.86, "🇧🇷"],
      [7, "Marruecos", 1755.10, "🇲🇦"],
      [8, "Países Bajos", 1753.57, "🇳🇱"],
      [9, "Bélgica", 1742.24, "🇧🇪"],
      [10, "Alemania", 1735.77, "🇩🇪"],
      [11, "Croacia", 1714.87, "🇭🇷"],
      [13, "Colombia", 1698.35, "🇨🇴"],
      [14, "México", 1687.48, "🇲🇽"],
      [15, "Senegal", 1684.07, "🇸🇳"],
      [16, "Uruguay", 1673.07, "🇺🇾"],
      [17, "Estados Unidos", 1671.23, "🇺🇸"],
      [18, "Japón", 1661.58, "🇯🇵"],
      [19, "Suiza", 1650.06, "🇨🇭"],
      [20, "Irán", 1619.58, "🇮🇷"],
      [22, "Turquía", 1605.73, "🇹🇷"],
      [23, "Ecuador", 1598.52, "🇪🇨"],
      [24, "Austria", 1597.40, "🇦🇹"],
      [25, "Corea del Sur", 1591.63, "🇰🇷"],
      [27, "Australia", 1579.34, "🇦🇺"],
      [28, "Argelia", 1571.03, "🇩🇿"],
      [29, "Egipto", 1562.37, "🇪🇬"],
      [30, "Canadá", 1559.48, "🇨🇦"],
      [31, "Noruega", 1557.44, "🇳🇴"],
      [33, "Costa de Marfil", 1540.87, "🇨🇮"],
      [34, "Panamá", 1539.16, "🇵🇦"],
      [38, "Suecia", 1509.79, "🇸🇪"],
      [40, "Chequia", 1505.74, "🇨🇿"],
      [41, "Paraguay", 1505.35, "🇵🇾"],
      [42, "Escocia", 1503.34, "🏴󠁧󠁢󠁳󠁣󠁴󠁿"],
      [45, "Túnez", 1476.41, "🇹🇳"],
      [46, "RD Congo", 1474.43, "🇨🇩"],
      [50, "Uzbekistán", 1458.73, "🇺🇿"],
      [56, "Catar", 1450.31, "🇶🇦"],
      [57, "Irak", 1446.28, "🇮🇶"],
      [60, "Sudáfrica", 1428.38, "🇿🇦"],
      [61, "Arabia Saudita", 1423.88, "🇸🇦"],
      [63, "Jordania", 1387.74, "🇯🇴"],
      [64, "Bosnia y Herzegovina", 1387.22, "🇧🇦"],
      [67, "Cabo Verde", 1371.11, "🇨🇻"],
      [73, "Ghana", 1346.88, "🇬🇭"],
      [82, "Curazao", 1294.77, "🇨🇼"],
      [83, "Haití", 1293.10, "🇭🇹"],
      [85, "Nueva Zelanda", 1275.58, "🇳🇿"],
    ];

    const tbody = document.getElementById("tbody");
    const empty = document.getElementById("empty");
    const footer = document.getElementById("footer");
    footer.textContent = data.length + " selecciones";

    function render(filter = "") {
      const q = filter.trim().toLowerCase();
      tbody.innerHTML = "";
      let shown = 0;
      data.forEach(([pos, name, pts, flag], i) => {
        if (q && !name.toLowerCase().includes(q)) return;
        shown++;
        const tr = document.createElement("tr");
        if (i === 0) tr.className = "top1";
        else if (i === 1) tr.className = "top2";
        else if (i === 2) tr.className = "top3";
        tr.innerHTML =
          `<td class="num pos">${pos}</td>` +
          `<td><span class="country"><span class="flag">${flag}</span>${name}</span></td>` +
          `<td class="points">${pts.toFixed(2)}</td>`;
        tbody.appendChild(tr);
      });
      empty.style.display = shown ? "none" : "block";
    }

    render();
    document.getElementById("search").addEventListener("input", e => render(e.target.value));

    // --- Comparación de selecciones ---
    const selA = document.getElementById("selA");
    const selB = document.getElementById("selB");
    const result = document.getElementById("result");
    const cardA = document.getElementById("cardA");
    const cardB = document.getElementById("cardB");
    const summary = document.getElementById("summary");
    const predict = document.getElementById("predict");

    // Predictor simple: base de goles + ventaja proporcional a la diferencia de puntos.
    // ~120 puntos de diferencia ≈ 1 gol de ventaja.
    function predictScore(a, b) {
      const BASE = 1.4;        // goles esperados de una selección pareja
      const PER_GOAL = 120;    // puntos por cada gol de ventaja
      const diff = (a[2] - b[2]) / PER_GOAL;
      const goalsA = Math.max(0, Math.round(BASE + diff / 2));
      const goalsB = Math.max(0, Math.round(BASE - diff / 2));
      return [goalsA, goalsB];
    }

    data.forEach(([pos, name], i) => {
      const optA = new Option(name, i);
      const optB = new Option(name, i);
      selA.add(optA);
      selB.add(optB);
    });
    selA.selectedIndex = 0;
    selB.selectedIndex = 1;

    function cardHTML([pos, name, pts, flag], isWinner) {
      return `<div class="vlabel">Pos. FIFA #${pos}</div>` +
             `<div class="vflag">${flag}</div>` +
             `<div class="vname">${name}</div>` +
             `<div class="vpts">${pts.toFixed(2)}</div>` +
             `<div class="vpos">${isWinner ? "👑 Líder" : ""}</div>`;
    }

    function compare() {
      const a = data[+selA.value];
      const b = data[+selB.value];
      if (selA.value === selB.value) {
        result.classList.remove("hidden");
        cardA.className = "vcard";
        cardB.className = "vcard";
        cardA.innerHTML = cardHTML(a, false);
        cardB.innerHTML = cardHTML(b, false);
        summary.innerHTML = "Selecciona dos países diferentes para comparar.";
        predict.innerHTML = "";
        return;
      }
      result.classList.remove("hidden");
      const aWins = a[2] >= b[2];
      cardA.className = "vcard" + (aWins ? " winner" : "");
      cardB.className = "vcard" + (!aWins ? " winner" : "");
      cardA.innerHTML = cardHTML(a, aWins);
      cardB.innerHTML = cardHTML(b, !aWins);

      const winner = aWins ? a : b;
      const diff = Math.abs(a[2] - b[2]).toFixed(2);
      const posDiff = Math.abs(a[0] - b[0]);
      summary.innerHTML =
        `<strong>${winner[3]} ${winner[1]}</strong> aventaja por ` +
        `<strong>${diff}</strong> puntos` +
        (posDiff ? ` y <strong>${posDiff}</strong> ${posDiff === 1 ? "puesto" : "puestos"} en el ranking.` : ` (mismo puesto).`);

      const [ga, gb] = predictScore(a, b);
      const outcome = ga === gb ? "Empate previsto" :
        (ga > gb ? `Victoria de ${a[1]}` : `Victoria de ${b[1]}`);
      predict.innerHTML =
        `<div class="plabel">Predicción de marcador</div>` +
        `<div class="score">` +
          `<span class="pflag">${a[3]}</span><span>${ga}</span>` +
          `<span class="dash">–</span>` +
          `<span>${gb}</span><span class="pflag">${b[3]}</span>` +
        `</div>` +
        `<div class="ptip">${outcome} · estimación según diferencia de puntos FIFA</div>`;
    }

    selA.addEventListener("change", compare);
    selB.addEventListener("change", compare);
    compare();
  </script>
</body>
</html>
